      <section>
        <h2>Read 3x Faster with AI-Powered Pacing</h2>
        <p>
          Traditional speed reading apps force you to process "hello" at the same speed as complex philosophy. 
          Your brain doesn't work that way. XYZ uses a local AI model to analyze text density and automatically 
          adjust pacing—slowing for difficult passages, accelerating through simple ones.
        </p>
      </section>

      <section>
        <h2>Why XYZ?</h2>
        <ul>
          <li><strong>100% Private:</strong> Everything runs in your browser. Your books never leave your device.</li>
          <li><strong>No Account Required:</strong> Just open the app and start reading. No email, no signup.</li>
          <li><strong>Free Forever:</strong> Open source software. No premium tiers, no subscriptions.</li>
          <li><strong>Works Offline:</strong> Once loaded, works without internet connection.</li>
          <li><strong>Multi-Format Support:</strong> Upload EPUB, PDF, Markdown, or TXT files from your library.</li>
          <li><strong>AI-Powered:</strong> Local LLM analyzes text complexity in real-time.</li>
        </ul>
      </section>

      <section>
        <h2>How It Works</h2>
        <p>
          XYZ uses RSVP (Rapid Serial Visual Presentation) to display words one at a time at a fixed point, 
          eliminating the need for eye movement. Combined with entropy-based pacing from a local AI model, 
          you can comfortably read at 500-1000+ words per minute while actually understanding the content.
        </p>
      </section>

      <section>
        <h2>Features</h2>
        <ul>
          <li>Adjustable speed from 50 to 2000 WPM</li>
          <li>Multiple display modes (Saccade, Velocireader, Focus Center)</li>
          <li>Reading progress tracking and bookmarks</li>
          <li>Chapter navigation</li>
          <li>Dark mode optimized for reading</li>
          <li>Mobile-friendly design</li>
          <li>Sync between devices via QR code (no cloud needed)</li>
        </ul>
      </section>

      <section>
        <h2>The Manifesto</h2>
        <p>
          XYZ represents a shift towards local-only usage of LLMs as a means to wrest control from Big AI. 
          We utilize already available models to perform LLM-agent interactions locally on the user side, 
          without any interaction with any other server. No logins. No tracking. Just free, open source software.
        </p>
      </section>

      <p><strong>JavaScript Required:</strong> XYZ requires JavaScript to run the speed reading interface and local AI models.</p>

  <script>
    // Dev-only: remove stale PWA workers without forcing surprise tab reloads.
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      const key = '__sw_cleanup_v3_' + location.port;
      if (!sessionStorage.getItem(key)) {
        sessionStorage.setItem(key, '1');

        const unregisterWorkers = 'serviceWorker' in navigator
          ? navigator.serviceWorker.getRegistrations().then(registrations => Promise.all(registrations.map(registration => registration.unregister())))
          : Promise.resolve();

        const clearPwaCaches = 'caches' in window
          ? window.caches.keys().then(keys => Promise.all(
              keys
                .filter(name => /workbox|precache|vite-pwa|dev-sw/i.test(name))
                .map(name => window.caches.delete(name))
            ))
          : Promise.resolve();

        Promise.all([unregisterWorkers, clearPwaCaches]).catch(() => {});
      }
    }
  </script>
